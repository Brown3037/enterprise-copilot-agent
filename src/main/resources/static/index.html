<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172720">
    <title>Enterprise Copilot · 客服工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232c563c'/%3E%3Cg fill='%23d4eea4'%3E%3Ccircle cx='12' cy='12' r='3.5'/%3E%3Ccircle cx='20' cy='12' r='3.5'/%3E%3Ccircle cx='12' cy='20' r='3.5'/%3E%3Ccircle cx='20' cy='20' r='3.5'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="/copilot.css">
    <script src="/copilot.js" defer></script>
</head>
<body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3zM8 9h8m-8 4h5"/></symbol>
        <symbol id="i-orders" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4v10l-8 4-8-4zm0 0 8 4 8-4m-8 4v10M8 5l8 4"/></symbol>
        <symbol id="i-policy" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zm9 0v5h5M9 12h6m-6 4h6"/></symbol>
        <symbol id="i-flow" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 6h6a3 3 0 0 1 3 3v6M6 9v6a3 3 0 0 0 3 3h6"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
        <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
        <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M15 5v14"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5m-11 5v-5h5m-4-2a7 7 0 0 1 12-3l3 5M4 12l3 5a7 7 0 0 0 12-3"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    </svg>

    <div class="workspace">
        <aside class="sidebar" id="sidebar" aria-label="会话导航">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
                <div><strong>Copilot</strong><small>企业客服</small></div>
                <button class="icon-button drawer-close" type="button" data-close aria-label="关闭会话导航">
                    <svg class="icon"><use href="#i-close"/></svg>
                </button>
            </div>
            <button class="new-chat" id="new-chat" type="button">
                <svg class="icon"><use href="#i-plus"/></svg><span>新建会话</span>
            </button>
            <nav class="session-nav" aria-label="历史会话">
                <div class="sidebar-label">会话记录</div>
                <div class="session-list" id="session-list"></div>
            </nav>
            <div class="profile">
                <span class="profile-avatar" id="profile-avatar" aria-hidden="true">01</span>
                <label for="persona" class="profile-text">
                    <span>演示用户</span>
                    <select id="persona" aria-label="切换演示用户">
                        <option value="U1001">U1001</option>
                        <option value="U1002">U1002</option>
                    </select>
                </label>
                <svg class="icon profile-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
            </div>
        </aside>

        <main class="main-panel" id="main-panel">
            <header class="main-header">
                <div class="header-title">
                    <button type="button" class="icon-button open-sessions" id="open-sessions" aria-label="打开会话导航" aria-controls="sidebar" aria-expanded="false">
                        <svg class="icon"><use href="#i-menu"/></svg>
                    </button>
                    <div class="page-title">客服工作台</div>
                </div>
                <button type="button" class="icon-button open-details" id="open-details" aria-label="打开运行详情" aria-controls="details" aria-expanded="false">
                    <svg class="icon"><use href="#i-panel"/></svg>
                </button>
            </header>

            <div class="conversation-scroll" id="conversation-scroll">
                <div class="content-width welcome" id="welcome">
                    <section class="hero" aria-labelledby="welcome-title">
                        <div class="hero-copy">
                            <h1 id="welcome-title">今天想处理什么？</h1>
                            <p>查订单、核对售后政策，或让工作流逐步处理。</p>
                        </div>
                        <div class="hero-art" aria-hidden="true">
                            <span class="orbit orbit-outer"></span><span class="orbit orbit-middle"></span>
                            <span class="orbit orbit-inner"></span><span class="satellite satellite-top"></span>
                            <span class="satellite satellite-bottom"></span><span class="satellite satellite-side"></span>
                            <div class="art-tile art-tile-back"></div>
                            <div class="art-tile art-tile-front">
                                <span></span><span></span><span></span><span></span>
                            </div>
                        </div>
                    </section>
                    <section aria-labelledby="starter-title" class="starter-section">
                        <h2 id="starter-title">试试这些任务</h2>
                        <div class="starter-grid" id="starters"></div>
                    </section>
                </div>
                <section class="content-width thread" id="thread" aria-label="当前会话" hidden>
                    <div id="messages" role="log" aria-label="对话消息" aria-live="off"></div>
                </section>
            </div>

            <div class="composer-area">
                <div class="content-width">
                    <form class="composer" id="composer">
                        <label class="sr-only" for="prompt">输入问题</label>
                        <textarea id="prompt" rows="2" placeholder="输入问题，或选择上方的任务…" maxlength="2000" required></textarea>
                        <div class="composer-actions">
                            <div class="mode-selector" aria-label="对话模式" role="group">
                                <button type="button" data-mode="stream" aria-pressed="true">流式对话</button>
                                <button type="button" data-mode="agents" aria-pressed="false">多智能体</button>
                                <button type="button" data-mode="graph" aria-pressed="false">LangGraph</button>
                            </div>
                            <button type="submit" class="send-button" id="send" aria-label="发送消息" disabled>
                                <svg class="icon"><use href="#i-arrow-up"/></svg>
                            </button>
                            <button type="button" class="send-button stop-button" id="stop" aria-label="停止接收回复" hidden>
                                <svg class="icon"><use href="#i-stop"/></svg>
                            </button>
                        </div>
                    </form>
                    <div class="composer-hints"><span id="mode-hint"></span><span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span></div>
                </div>
            </div>
        </main>

        <aside class="details" id="details" aria-labelledby="details-title">
            <header class="details-header">
                <div class="header-title">
                    <span class="details-icon" aria-hidden="true"><svg class="icon"><use href="#i-panel"/></svg></span>
                    <h2 id="details-title">运行详情</h2>
                </div>
                <button class="icon-button drawer-close" type="button" data-close aria-label="关闭运行详情">
                    <svg class="icon"><use href="#i-close"/></svg>
                </button>
            </header>
            <div class="details-body">
                <section aria-labelledby="trace-title" class="trace-section">
                    <div class="section-heading"><h3 id="trace-title" tabindex="-1">执行轨迹</h3><span class="trace-status" id="trace-status">等待请求</span></div>
                    <p class="trace-caption" id="trace-caption"></p>
                    <ol class="steps" id="steps"></ol>
                    <div id="trace-result"></div>
                </section>
                <section aria-labelledby="service-title" class="service-section">
                    <div class="section-heading">
                        <h3 id="service-title">服务状态</h3>
                        <button class="icon-button refresh-button" id="refresh" type="button" aria-label="刷新服务状态" title="刷新服务状态">
                            <svg class="icon"><use href="#i-refresh"/></svg>
                        </button>
                    </div>
                    <div class="service-list" id="services" aria-live="polite"></div>
                </section>
            </div>
        </aside>
        <button id="backdrop" class="backdrop" type="button" aria-label="关闭侧栏" hidden></button>
        <div id="announcement" class="sr-only" aria-live="polite"></div>
    </div>
</body>
</html>
